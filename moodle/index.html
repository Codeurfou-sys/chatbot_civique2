<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CiviCoach</title><style>*{box-sizing:border-box}body{margin:0;background:#fff5f7;font:17px system-ui;color:#2c3e50}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center;background:#fff5f7;z-index:2}#loading img{width:90px}#loading[hidden]{display:none}iframe{width:100%;height:100vh;border:0;display:block}.dots{display:flex;gap:6px}.dots i{width:9px;height:9px;background:#832640;border-radius:50%;animation:pulse 1s infinite}.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}@keyframes pulse{0%,75%,100%{opacity:.3}35%{opacity:1}}@media(prefers-reduced-motion:reduce){.dots i{animation:none}}</style></head><body><div id="loading" role="status"><img src="../Mascotteredim.png" alt="Mascotte CiviCoach"><p>CiviCoach arrive ! Patientez quelques secondes…</p><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></div><iframe id="civicoach" src="../chatbot/?integration=moodle&v=40" title="CiviCoach — préparation à l’examen civique" allow="clipboard-write"></iframe><script>
const frame=document.getElementById('civicoach');let integration=null;
window.addEventListener('message',e=>{
 if(e.origin===location.origin&&e.source===frame.contentWindow){
  if(e.data?.source==='civicoach-ready')document.getElementById('loading').hidden=true;
  if(e.data?.source==='civicoach-integration-request'){if(integration)frame.contentWindow.postMessage(integration,location.origin);else if(parent!==window)parent.postMessage(e.data,'*');}
  if(e.data?.source==='civicoach-return-widget'){if(parent!==window)parent.postMessage(e.data,'*');try{top.focus();}catch(err){}}
 }
 if(e.source===parent&&parent!==window&&e.data?.source==='civicoach-integration'){try{if(new URL(e.data.returnUrl).origin!==e.origin)return;integration=e.data;frame.contentWindow.postMessage(integration,location.origin);}catch(err){}}
});
</script></body></html>
