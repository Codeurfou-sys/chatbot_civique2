<script>
(function () {
  function initWidget() {
    if (document.getElementById('frate-chat-widget')) return;
    let courseId = null;
    for (const name of document.body.classList) {
      const match = name.match(/^course-(\d+)$/);
      if (match) { courseId = match[1]; break; }
    }
    if (!courseId) courseId = new URLSearchParams(location.search).get('id');

    const CIVICOACH_ORIGIN = 'https://codeurfou-sys.github.io';
    const CIVICOACH_BASE = CIVICOACH_ORIGIN + '/chatbot_civique2/';
    let chatbotURL = '', mascotte = false;
    switch (String(courseId)) {
      case '92':
        chatbotURL = CIVICOACH_BASE + 'chatbot/?integration=moodle&v=43';
        mascotte = true;
        break;
      case '162':
        chatbotURL = 'https://chatmd.forge.apps.education.fr/#https://raw.githubusercontent.com/Codeurfou-sys/MentoratMD/main/assistant_mentorat.md';
        break;
      case '233':
        chatbotURL = 'https://chatmd.forge.apps.education.fr/#https://raw.githubusercontent.com/Codeurfou-sys/Assistant-entretiens-pro-/main/assistant_entretiens_pro.md';
        break;
      default: return;
    }

    const images = {
      repos: CIVICOACH_BASE + 'Mascotte1.png',
      hover: CIVICOACH_BASE + 'Mascotte2.png',
      open: CIVICOACH_BASE + 'Mascotte6.png'
    };
    let transfer = '', ready = false, retryTimer = null;
    if (mascotte && location.hash.startsWith('#civicoach-retour=')) {
      try {
        transfer = location.hash.slice(18);
        const saved = JSON.parse(decodeURIComponent(transfer));
        const original = new URL(saved.integrationContext.url);
        if (original.origin !== location.origin || saved.version !== 14) throw Error();
        history.replaceState(null, '', original.pathname + original.search + original.hash);
      } catch (error) { transfer = ''; }
    }

    const style = document.createElement('style');
    style.textContent = `
      #frate-chat-widget { position:fixed!important;bottom:24px!important;right:90px!important;z-index:999999!important;display:flex!important;flex-direction:column-reverse!important;align-items:flex-end!important; }
      #frate-widget-summary { list-style:none!important;outline:none;width:56px!important;height:56px!important;border-radius:50%!important;background:#b21c1a!important;box-shadow:0 4px 12px rgba(166,28,60,.45)!important;display:flex!important;align-items:center!important;justify-content:center!important;cursor:pointer!important;border:0!important;padding:0!important;overflow:hidden!important;animation:frate-levitation 3s ease-in-out infinite;transition:transform .2s ease; }
      #frate-widget-summary:hover { transform:scale(1.12) rotate(3deg)!important; }
      #frate-widget-summary::-webkit-details-marker { display:none!important; }
      #frate-widget-summary:focus-visible { outline:3px solid #f2c34f!important;outline-offset:4px; }
      #frate-chat-widget .mascotte-moodle-img { width:44px!important;height:44px!important;object-fit:contain!important;display:block!important;pointer-events:none!important; }
      #frate-chat-widget .bulle-dialogue-moodle { font-size:26px!important;color:#fff!important;user-select:none; }
      #frate-widget-panel { position:relative!important;width:min(620px,calc(100vw - 32px))!important;height:min(780px,calc(100vh - 110px))!important;border-radius:16px!important;overflow:hidden!important;background:#fff!important;box-shadow:0 8px 28px rgba(0,0,0,.35)!important;margin-bottom:10px!important; }
      #frate-chat-frame { width:100%!important;height:100%!important;border:0!important;display:block!important; }
      #frate-widget-wait { position:absolute!important;inset:0!important;z-index:2!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;padding:24px!important;text-align:center!important;background:#fff5f7!important;color:#30343b!important;font:18px/1.5 system-ui,sans-serif!important; }
      #frate-widget-wait[hidden],#frate-widget-retry[hidden] { display:none!important; }
      #frate-widget-wait img { width:88px!important;height:88px!important;object-fit:contain!important; }
      #frate-chat-widget .frate-loading-dots { display:flex!important;gap:8px!important;margin-top:12px!important; }
      #frate-chat-widget .frate-loading-dots i { width:9px!important;height:9px!important;border-radius:50%!important;background:#b21c1a!important;animation:frate-dot 1.1s infinite; }
      #frate-chat-widget .frate-loading-dots i:nth-child(2) { animation-delay:.18s; }
      #frate-chat-widget .frate-loading-dots i:nth-child(3) { animation-delay:.36s; }
      #frate-widget-retry { font:inherit!important;margin-top:20px!important;padding:10px 16px!important;border:1px solid #b21c1a!important;border-radius:12px!important;background:#fff!important;color:#b21c1a!important;cursor:pointer!important; }
      @keyframes frate-levitation { 0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)} }
      @keyframes frate-dot { 0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)} }
      @media(max-width:740px) { #frate-chat-widget{right:16px!important;} }
      @media(prefers-reduced-motion:reduce) { #frate-widget-summary,#frate-chat-widget .frate-loading-dots i{animation:none!important;} }
    `;
    document.head.append(style);
    const widget = document.createElement('details');
    widget.id = 'frate-chat-widget';
    widget.innerHTML = `
      <summary id="frate-widget-summary" aria-label="${mascotte ? 'Ouvrir CiviCoach' : 'Ouvrir votre assistant'}" aria-controls="frate-widget-panel" aria-expanded="false">
        ${mascotte ? `<img id="mascotte-anim-element" src="${images.repos}" alt="" class="mascotte-moodle-img">` : '<span class="bulle-dialogue-moodle" aria-hidden="true">💬</span>'}
      </summary>
      <div id="frate-widget-panel">
        <div id="frate-widget-wait" role="status" aria-live="polite">
          ${mascotte ? `<img src="${images.open}" alt="Mascotte CiviCoach">` : ''}
          <p>${mascotte ? 'CiviCoach arrive !' : 'Votre assistant arrive !'}<br>Patientez quelques secondes…</p>
          <span class="frate-loading-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <button id="frate-widget-retry" type="button" hidden>Recharger l’assistant</button>
        </div>
        <iframe id="frate-chat-frame" title="${mascotte ? 'CiviCoach — préparation à l’examen civique' : 'Assistant Frate'}"></iframe>
      </div>`;
    document.body.append(widget);
    const summary = widget.querySelector('summary');
    const frame = widget.querySelector('iframe');
    const waiting = widget.querySelector('#frate-widget-wait');
    const retry = widget.querySelector('#frate-widget-retry');
    const image = widget.querySelector('#mascotte-anim-element');

    function finishLoading() {
      ready = true;
      waiting.hidden = true;
      retry.hidden = true;
      clearTimeout(retryTimer);
    }
    function load() {
      ready = false;
      waiting.hidden = false;
      retry.hidden = true;
      clearTimeout(retryTimer);
      frame.src = chatbotURL + (transfer ? '#parcours=' + transfer : '');
      retryTimer = setTimeout(() => { if (!ready) retry.hidden = false; }, 20000);
    }
    function open() {
      widget.open = true;
      summary.setAttribute('aria-expanded', 'true');
      if (!frame.getAttribute('src')) load();
      waiting.hidden = ready;
    }
    summary.addEventListener('mouseenter', () => { if (image && !widget.open) image.src = images.hover; });
    summary.addEventListener('mouseleave', () => { if (image && !widget.open) image.src = images.repos; });
    widget.addEventListener('toggle', () => {
      summary.setAttribute('aria-expanded', String(widget.open));
      if (image) image.src = widget.open ? images.open : images.repos;
      if (widget.open) open();
    });
    retry.onclick = load;
    if (!mascotte) frame.addEventListener('load', () => { if (frame.getAttribute('src')) finishLoading(); });

    window.addEventListener('message', event => {
      if (!mascotte || event.origin !== CIVICOACH_ORIGIN || event.source !== frame.contentWindow) return;
      if (event.data?.source === 'civicoach-ready') finishLoading();
      if (event.data?.source === 'civicoach-integration-request') {
        frame.contentWindow.postMessage({ source:'civicoach-integration', returnUrl:location.href, returnOrigin:location.origin }, CIVICOACH_ORIGIN);
      }
      if (event.data?.source === 'civicoach-return-widget') {
        open();
        window.focus();
        frame.focus();
      }
    });
    if (transfer) open();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initWidget, { once:true });
  else initWidget();
})();
</script>
