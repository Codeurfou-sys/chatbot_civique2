<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Tester les fiches CiviCoach</title><link rel="stylesheet" href="../chatbot/accessibilite.css"><link rel="stylesheet" href="../chatbot/fiches.css"><style>body{max-width:1100px;margin:30px auto;padding:20px;font:18px/1.5 system-ui;background:#fafaf7;color:#243447}button,select,input{font:inherit}fieldset{margin:20px 0;border-radius:12px;border:1px solid #a33360;padding:20px}label{display:block;padding:8px;border-bottom:1px solid #ddd}input[type=search]{width:90%;padding:10px}#list{max-height:55vh;overflow:auto}img{max-width:100px}button{padding:10px 15px;margin:5px;cursor:pointer}</style><h1>Tester mes fiches de révision</h1><p>Choisissez les notions d’erreurs à réunir. Ce test utilise le même générateur que le chatbot. Il ne modifie pas vos résultats enregistrés.</p><select id="kind"><option value="examen">Examen blanc</option><option value="bilan">Premier bilan / bilan de progression</option><option value="entrainement">Entraînement</option><option value="revision">Révision</option></select><p><label>Profil du PDF : <select id="profile"><option value="general">Couleurs habituelles</option><option value="deuteranopia">Deutéranopie</option><option value="protanopia">Protanopie</option><option value="tritanopia">Tritanopie</option><option value="achromatopsia">Achromatopsie</option></select></label><label><input type="checkbox" id="large"> Texte agrandi</label><label><input type="checkbox" id="contrast"> Contraste renforcé</label></p><p><input id="search" type="search" placeholder="Rechercher une notion, un auteur, un chapitre…"></p><div id="list"></div><p id="status" role="status"></p><button id="pdf">Télécharger ma fiche de test</button><button id="reset">Effacer les choix</button><div id="preview"></div><script src="../chatbot/vendor/jspdf.umd.min.js"></script><script src="../chatbot/vendor/parcours-font.js"></script><script src="../chatbot/vendor/parcours-font-bold.js"></script><script src="../chatbot/frate-brand.js"></script><script src="../chatbot/fiches-art.js"></script><script src="../chatbot/fiches-data.js"></script><script src="../chatbot/fiches-visuels.js"></script><script src="../chatbot/vendor/repere-hand.js"></script>
<script src="../chatbot/vendor/repere-title.js?v=f50bdf4a47cf393d"></script><script src="../chatbot/fiches-regles.js"></script><script src="../chatbot/fiches-contenus.js"></script><script src="../chatbot/fiches-coherence.js"></script><script src="../chatbot/fiches-territoires.js?v=f50bdf4a47cf393d"></script><script src="../chatbot/fiches-autonomes.js?v=f50bdf4a47cf393d"></script><script src="../chatbot/fiches-audio.js"></script><script>
window.NovaAccess={settings:()=>({markers:document.getElementById('profile').value!=='general',colourProfile:document.getElementById('profile').value,large:document.getElementById('large').checked,contrast:document.getElementById('contrast').checked})};
const keys=new Set(),all=[...Object.entries(CiviSheetsData.questions),...Object.entries(CiviSheetsData.revision),...Object.entries(CiviSheetsData.activities)].map(([key,q])=>({...q,key}));const chosen=new Set(),list=document.getElementById('list'),preview=document.getElementById('preview'),status=document.getElementById('status');const unique=all.filter(q=>{const id=q.theme+'|'+q.question+'|'+q.correct+'|'+(q.context||'');if(keys.has(id))return false;keys.add(id);return true;});
function cards(){return unique.filter(q=>chosen.has(q.key)).map(q=>({...q,kind:document.getElementById('kind').value,source:'Exemple de test'}));}
function refresh(){const a=NovaAccess.settings();document.documentElement.dataset.civiColourProfile=a.markers?a.colourProfile:'off';document.documentElement.classList.toggle('civi-a11y-markers',a.markers);document.documentElement.classList.toggle('civi-a11y-large',a.large);document.documentElement.classList.toggle('civi-a11y-contrast',a.contrast);const selected=cards(),model=NovaSheetsRules.plan(selected,{kind:document.getElementById('kind').value});status.textContent=model.notionCount+' notion(s) choisie(s). '+(model.mode==='empty'?'Aucune fiche sans erreur.':model.mode==='par-thematique'?'Fiches par thème dans un seul PDF.':'Une synthèse dans un seul PDF.');document.getElementById('pdf').disabled=!selected.length;preview.replaceChildren();for(const b of model.blocks){const section=document.createElement('section');section.className='civi-sheet-theme';section.style.setProperty('--sheet-theme-colour',CiviSheetsVisual.profile().ink?'rgb('+CiviSheetsVisual.profile().ink.join(',')+')':b.colour);const h=document.createElement('h2');h.className='civi-sheet-theme-title';h.textContent=b.title;section.append(h);for(const q of b.notions){const article=document.createElement('article');article.className='civi-sheet';const title=document.createElement('h3');title.textContent=CiviSheetsVisual.title(q);const v=CiviSheetsVisual.pick(q),img=document.createElement('img');img.src=CiviSheetsVisual.profile().mono?CiviSheetsArtMono[v.key]:v.src;img.alt=v.label;img.style.maxWidth='180px';article.append(title,img);for(const part of CiviSheetsVisual.composition(q).facts){const p=document.createElement('p');p.textContent=part.label+' : '+part.text;article.append(p);}section.append(article);}preview.append(section);}}
function paint(){list.replaceChildren();const term=document.getElementById('search').value.toLocaleLowerCase('fr');for(const q of unique.filter(q=>(q.question+' '+q.correct+' '+q.notion).toLocaleLowerCase('fr').includes(term)).slice(0,200)){const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=chosen.has(q.key);check.onchange=()=>{check.checked?chosen.add(q.key):chosen.delete(q.key);refresh();};label.append(check,document.createTextNode(' '+q.question+' → '+q.correct));list.append(label);}}
for(const id of ['profile','large','contrast'])document.getElementById(id).onchange=refresh;document.getElementById('search').oninput=paint;document.getElementById('kind').onchange=refresh;document.getElementById('reset').onclick=()=>{chosen.clear();paint();refresh();};document.getElementById('pdf').onclick=()=>NovaSheetsRules.buildPdf(cards(),{kind:document.getElementById('kind').value}).save('fiche-test-civicoach.pdf');paint();refresh();
</script></html>
