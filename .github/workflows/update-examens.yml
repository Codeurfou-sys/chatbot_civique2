name: Actualiser les sessions d'examen

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Actualiser les sessions FRATE
        run: |
          python update_passer_examen.py \
            --workbook FICHIER_EXCEL_MOTEUR_CHAT_BOT.xlsx \
            --output-workbook exports_chatmd/FICHIER_EXCEL_MOTEUR_CHAT_BOT_module07_actualise.xlsx \
            --output-dir exports_chatmd \
            --require-frate

      - name: Régénérer les fichiers ChatMD
        run: |
          python export_chatmd.py \
            --workbook exports_chatmd/FICHIER_EXCEL_MOTEUR_CHAT_BOT_module07_actualise.xlsx \
            --output-dir exports_chatmd \
            --force

      - name: Appliquer la présentation validée au module 07
        run: python postprocess_module07.py exports_chatmd/modules/07_passer_examen.md

      - name: Contrôler le module publié
        run: python validate_passer_examen.py exports_chatmd/modules/07_passer_examen.md

      - name: Actualiser uniquement le module 07 dans le chatbot V2
        run: |
          cp exports_chatmd/modules/07_passer_examen.md modules/07_passer_examen.md
          python sync_module07_into_chatbot.py chat_bot.md modules/07_passer_examen.md

      - name: Publier uniquement si les fichiers ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports_chatmd modules/07_passer_examen.md chat_bot.md
          if git diff --cached --quiet; then
            echo "Aucune modification à publier."
          else
            git commit -m "Actualisation automatique des sessions d'examen"
            git push
          fi
